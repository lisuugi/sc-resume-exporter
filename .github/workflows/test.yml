name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - name: Build
        run: npm run build

      # 빌드 산출물(dist/, index.html 의 북마클릿)은 커밋 대상이다.
      # 소스만 고치고 빌드를 빠뜨리면 배포본이 어긋나므로 여기서 잡는다.
      - name: Check build output is committed
        run: git diff --exit-code -- dist index.html

      - name: Test (src)
        run: npm test

      - name: Test (dist)
        run: npm test
        env:
          TARGET: dist
